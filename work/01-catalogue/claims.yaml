      in particular ||u|| <= sqrt(R_s^2 + arc^2). With X: R^13 -> R^36 giving s at the seed positions and
      (X(s,theta))_j = Im(D_j^o J(s,theta)_j) at the lower-right positions, u = X(s,theta) + e_D + e_sin with
      ||e_D|| <= E_r and ||e_sin||_1 <= arc^3/6, both supported on I_D.
    hypotheses:
