  - id: lem-4.7
    kind: lemma
    title: "Equivalence transport"
    paper_locator: "§4.3, Lemma 4.7, p. 25, eq. (4.16)"
    one_line_statement: >-
      Let Phi be a signed row/column permutation with optional transpose and optional simultaneous sign
      change of all entries. Then Phi is a real linear isometry commuting with Pi, ||F(Phi P)|| = ||F(P)||,
      the residual norm is invariant under row/column rephasings and entrywise integer additions,
      replacing (P,T) by (Phi P, Phi T) (Phi applied to every column) preserves every certified Root
      assertion with the same scalar constants, and the existence of an extension by two further MUBs is
      preserved in both directions.
    hypotheses:
      - "Phi in the signed permutation/transpose group"
    status: M
    status_parts: "M: ||A A^*||_F = ||A^* A||_F and ||F(P)||^2 = (||AA^*||_F^2 - 216)/(8 pi^2)"
    depends_on: [def-4.1, def-2.1]
    owner_team: T4 lean
    evidence: "§4.3 pp. 24-25; results/proof-claims.md §4"
    open_questions: >-
