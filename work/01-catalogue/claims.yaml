  # ------------------------------------------------------------------ 4
  - id: def-4.1
    kind: definition
    title: "Root certificate"
    paper_locator: "§4.1, Definition 4.1, p. 22, eqs. (4.3)-(4.7)"
    one_line_statement: >-
      A Root is data (P, T, (C, n0, id, ort, hor, mnorm, froot)) with P in R^36 a stored centre,
      T in R^{36 x k} a stored real tangent matrix with 0 <= k <= 10, and seven nonnegative constants,
      such that ||T^*T - I|| <= ort, ||(I - Pi)T|| <= hor, ||F(P)|| <= froot (4.4) and, for EVERY
      horizontal delta with F(P + delta) = 0, with eta = T^* delta and s = ||delta||:
      ||(I - TT^*) delta|| <= n_P(s) := n0 + id s + C s^2, s^2 <= (1+ort)||eta||^2 + ||(I-TT^*)delta||^2,
      and for every horizontal v, with h' = delta - v:
      ||(I - TT^*) h'|| <= (id + C(||delta|| + ||v||)) ||h'|| + mnorm ||F(P + v)||. There is no radius
      restriction and no assertion that F(P) = 0.
    hypotheses:
      - "dimension 6, horizontal subspace V = im Pi"
    status: D
    status_parts: "D: the definition (seven constants; the assertions are (4.5)-(4.7)). Satisfiability is Prop 4.5, and production by the code is Prop 4.6"
    depends_on: [lem-2.3]
    owner_team: T2 checker
    evidence: "§4.1 pp. 21-22; results/code-audit.md §2 tabulates which routine supplies which constant"
    open_questions: >-
      The seven constants are the interface between Stages A, B and C, and they are renamed twice
      (§5.1, §6.1). notation.tex fixes the mapping; T2's record format should store the Def 4.1 names only.

  - id: root-disp-n
    kind: equation
    title: "Root displacement assertion: normal bound"
    paper_locator: "§4.1, eq. (4.5), p. 22"
    one_line_statement: >-
      For every Horizontal delta with F(P + delta) = 0, with eta = T^* delta and s = ||delta||:
      ||(I - T T^*) delta|| <= n_P(s) = n_0 + id s + C s^2. No radius restriction.
    hypotheses:
      - "the Root data (P,T,C,n0,id) of Definition 4.1"
      - "delta horizontal and F(P+delta) = 0"
    status: M
    status_parts: "D: an assertion required of certified Root data. Its satisfiability is Prop 4.5; its production is Prop 4.6. The inequality is the object T2 must check on a stored Root"
    depends_on: [def-4.1]
    owner_team: T2 checker
    evidence: "§4.1 p. 22; used in Prop 4.13 / (4.38) and in (6.2)"
    open_questions: "This id exists so that T2's inequalities.md can cite (4.5) itself rather than def-4.1 (changerequest T1-audit CR-T1A-4)."

  - id: root-disp-s
