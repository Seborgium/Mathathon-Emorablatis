      T9 should check the transpose direction separately (it is the one that is not obvious).

  - id: lem-4.8
    kind: lemma
    title: "Arc and weighted-arc bounds"
    paper_locator: "§4.4, Lemma 4.8, p. 26, eqs. (4.18)-(4.19)"
    one_line_statement: >-
      Suppose m_j = |D_j| > 0 at every lower-right position, put D_j^o = D_j/m_j, and let d_j in [-pi,pi]
      be the shortest angular displacement from D_j^o to D'_j. Let slack be a nonnegative upper bound for
      z^2 - sum_j (m_j - 1)^2, let m_i be a positive lower bound for min_j m_j, and let q_d >= slack/m_i with
      q_d < 3.8. Then ||d|| <= arc and sqrt(sum_j m_j d_j^2) <= weighted, provided
      arc >= sqrt(q_d/(1 - q_d/4)) and weighted >= sqrt(slack/(1 - q_d/4)).
    hypotheses:
      - "m_j > 0 for all sixteen positions"
      - "a nonnegative upper bound slack for z^2 - sum_j (m_j-1)^2"
      - "q_d < 3.8"
    status: M
    status_parts: "M: entrywise identity |D'_j - D_j|^2 = (m_j-1)^2 + m_j |D'^o_j - D_j^o|^2, then |arcsin| <= t/sqrt(1 - q_d/4)"
    depends_on: [lem-3.8]
    owner_team: T4 lean
    evidence: "§4.4 pp. 25-26; the run's guard q_d < 3.8 in Candidate::prep is recorded in results/code-audit.md §2"
    open_questions: >-
      q_d < 3.8 is a hypothesis of the lemma; the code checks it. That check must be part of the Root's
      stored certificate, since with q_d >= 4 the factor 1 - q_d/4 changes sign.

  - id: lem-4.9
