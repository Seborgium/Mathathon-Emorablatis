  - id: flow-7.2
    kind: execution
    title: "Specified finite control flow and its terminal conditions"
    paper_locator: "§7.1-§7.2, pp. 2-51; terminal conditions p. 51"
    one_line_statement: >-
      The pipeline consists of one cover invocation, four A shards (part i processes the centre indices
      congruent to i mod 4), two sequential B refinements, one initial C invocation per batch named by the
      completed-batches marker, one B fallback over all nonempty C bad files, and four final C modulo-4
      shards; and the run is accepted only if all five terminal conditions hold: (1) successful builds and
      a complete centre file; (2) four A exits 0, all centres processed, terminal failedBalls = 0, four
      empty bad text files; (3) both B exits 0, all parents processed, logged and saved counts agree,
      zero-count bad files; (4) every initial C batch processed exactly once with consistent exit, done
      count, bad count and saved records; (5) every initial C bad record included in fallback, fallback
      exit 0 with all parents processed and zero saved failures, four final C exits 0 with total done equal
      to the fallback count and zero saved failures.
    hypotheses:
      - "C numeric locale, fresh output paths, atomic batch renames, immutable insertion order"
    status: E
    status_parts: "E: this is the observed control flow of the documented run. M: the argument (proof of Theorem 7.1) that these conditions suffice to carry the exact solution's record through every stage"
    depends_on: [prem-arith]
    owner_team: T8 paper
    evidence: "§7.2 pp. 50-51; §7.5 pp. 53-54 (all 100 invocations accounted for; the fifteen initial C exits 1 resolved by the fallback chain)"
    open_questions: >-
      The sufficiency of these five conditions is a bookkeeping lemma that is only proved inside Theorem
      7.1's proof (p. 52). T4 should extract it: 'if a record enters every stage and no stage fails, the
      record survives' is a finite combinatorial statement over file lists, and it is the right thing to
      formalise separately from the geometry.

