    paper_locator: "§3.4, Lemma 3.5, p. 16, eqs. (3.15)-(3.19)"
    one_line_statement: >-
      With D = D_span + D_ker, D_span = -C_0 E_0^* G_B^*, D_ker = sqrt6 K_C U K_B^*, Z = D' - D: the
      three matrices Z P_B, P_C Z P_K, (I - P_C) Z P_K are pairwise Frobenius-orthogonal and sum to Z;
