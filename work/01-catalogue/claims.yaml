    paper_locator: "§5.4-§5.5, Proposition 5.7, p. 38, eq. (5.26)"
    one_line_statement: >-
      Suppose Stage B is run on a finite list of Records with valid Root certificates under the arithmetic
      assumptions of Appendix A. On a completed run, with A the final atlas of children and B the list of
      input parents whose refinement failed:
      the union of S(P,R) over the input parents is contained in the union of S(Q,r) over the final atlas
