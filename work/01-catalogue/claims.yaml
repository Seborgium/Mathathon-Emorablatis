  - id: lem-a.1
    kind: lemma
    title: "Accumulation and norm bounds"
    paper_locator: "§A.1, Lemma A.1, p. 56, eqs. (A.3)-(A.4)"
    one_line_statement: >-
      For m <= 2000, a dot product on exact stored inputs formed as separate products and successive
      additions satisfies |fl(sum a_i b_i) - sum a_i b_i| <= gamma_m sum |a_i b_i| + 4(m+1) tau with
      gamma_m = 2.1e-16 (m+1); and for the square-sum/square-root norms used here,
      |fl(||a||) - ||a||| <= 2.2e-16 (m+2) ||a|| + 1e-140.
    hypotheses:
      - "the arithmetic premises of prem-arith (in particular no contraction)"
      - "m <= 2000"
    status: S
    status_parts: "S: a statement about an arithmetic model, not about mathematics. It is the standard Higham-type accumulation bound and its constants are checkable by hand, but its applicability depends on the code performing exactly those operations"
    depends_on: [prem-arith]
    owner_team: T2 checker
    evidence: "§A.1 pp. 55-57; §A.2 p. 57 on u and the additive underflow allowance"
    open_questions: "If T2 uses interval arithmetic this lemma disappears; if it re-uses binary64 it must re-derive it for its own operation order."

  - id: lem-a.2
    kind: lemma
    title: "Unit-exponential error"
    paper_locator: "§A.2, Lemma A.2, p. 57, eq. (A.10)"
    one_line_statement: >-
      At a finite stored x with |x| <= 16, the routine expair differs from e(x) = exp(2 pi i x) in complex
      modulus by less than 2e-14; consequently the common bound eps_exp = 6e-14 is valid for all its uses
      in the certificate, including argument formation. Separately, |pi_hat - pi| < 1.225e-16 for the
      stored pi, by Machin's identity, alternating-series bounds and exact rational arithmetic.
    hypotheses:
      - "|x| <= 16 (all arguments in the certificate satisfy |P| <= 4, |v| <= 2, differences <= 6)"
      - "the arithmetic premises of prem-arith"
    status: S
    status_parts: "S: the expair bound is a statement about the routine's implementation (guarded range, reduced argument, polynomial). M: the pi bound is a genuine certified inequality, checkable without a computer algebra system"
    depends_on: [prem-arith, lem-a.1]
    owner_team: T5 parameters
    evidence: "§A.2 pp. 57-58"
    open_questions: >-
      eps_exp = 6e-14 is one of the three different objects the paper calls epsilon; see notation.tex.
      The pi part is worth keeping in the final paper even if everything else is replaced -- it is three
      lines and completely checkable.

