  - id: rem-4.2
    kind: remark
    title: "T is only a frame of numerical directions"
    paper_locator: "§4.1, Remark 4.2, p. 22"
    one_line_statement: >-
      The columns of T are numerical directions only: neither exact horizontality nor exact orthogonality
      is assumed, ||T|| <= sqrt(1 + ort), the hor error is retained when raw displacements are projected,
      and no constant-rank or manifold hypothesis on the exact solution set is needed.
    hypotheses:
      - "T is the stored tangent matrix of a Root"
    status: M
    status_parts: "M: (4.4) gives the operator bound; the remark records what the proof does not assume"
    depends_on: [def-4.1]
    owner_team: T4 lean
    evidence: "§4.1 p. 22"
    open_questions: >-
      This remark is what makes the whole argument not a manifold-parametrisation argument. T8's narrative
      should say so explicitly: the normal directions are bounded, not eliminated.

  - id: lem-4.3
    kind: lemma
    title: "Quadratic and difference remainders"
    paper_locator: "§4.2, Lemma 4.3, p. 23, eqs. (4.8)-(4.12)"
    one_line_statement: >-
      With F_ij(P) = (1/2 pi i) sum_g e(P_ig - P_jg) and L_P the first variation: there is a real 30-vector
      R_P(x) with F(P+x) = F(P) + L_P x + R_P(x); for a_ij(x) = ||x_i - x_j||^2,
      |(R_P(x))_ij| <= pi a_ij(x) and |(R_P(x) - R_P(v))_ij| <= pi sqrt(a_ij(x-v)) (sqrt(a_ij(x)) + sqrt(a_ij(v))).
      Moreover if M: R^30 -> R^36 is any real matrix and for every horizontal x and every unit y in R^36,
      sum_{i>j} w_ij(y) a_ij(x) <= b ||x||^2 (w_ij(y) = norm of the two edge coordinates of M^*y), then
      ||M R_P(x)|| <= pi b ||x||^2 and ||M(R_P(x) - R_P(v))|| <= pi b ||x - v|| (||x|| + ||v||).
    hypotheses:
      - "x, v horizontal (in im Pi)"
      - "the scalar remainder r(t) = (e(t) - 1 - 2 pi i t)/(2 pi i) with |r| <= pi t^2"
    status: M
    status_parts: "M: two-line scalar estimates"
    depends_on: [def-4.1, def-2.1]
    owner_team: T4 lean
    evidence: "§4.2 p. 22; results/proof-claims.md §4"
    open_questions: "none"

  - id: lem-4.4
    kind: lemma
    title: "Two computable remainder constants"
    paper_locator: "§4.2, Lemma 4.4, p. 23, eqs. (4.13)-(4.14)"
    one_line_statement: >-
      Two sufficient choices for b in (4.10) are b = sqrt(8) ||M|| and b = sqrt(6) ||S||, where S is the
      30x216 real matrix with rows S_{a,:} = M_{:,a} tensor (e_i - e_j)^* for the two real-coordinate
      indices a of each edge i > j; consequently pi times the smaller certified upper bound for these two
      quantities is a valid C for Definition 4.1. (§A.5 states the first of the two as C = pi sqrt(8) mnorm + 1e-7.)
    hypotheses:
      - "the identifications sum_{i>j} a_ij = 6 s^2, sum u_i^2 <= (5/6) s^4, sum a_ij^2 <= 8 s^4"
      - "a certified upper bound for ||S|| (or ||M||)"
    status: M
    status_parts: "M: the three combinatorial identities plus the tensorisation (sum_{i>j} a_ij <= 6 s^2, sum u_i^2 <= (5/6) s^4, sum a_ij^2 <= 8 s^4); the radicals are sqrt(8) and sqrt(6), not 8 and 6"
    depends_on: [lem-4.3]
    owner_team: T4 lean
    evidence: "§4.2 p. 23; the Gram SS^* formula (4.14) is what the code evaluates"
    open_questions: "none"

  - id: prop-4.5
    kind: proposition
    title: "Sufficient conditions for a Root certificate"
    paper_locator: "§4.2, Proposition 4.5, p. 24, eq. (4.15)"
    one_line_statement: >-
      Let P, T and the seven nonnegative constants be as in Definition 4.1. Suppose (4.4) holds and there
      is a stored real 36x30 matrix M with ||M|| <= mnorm, mnorm * froot <= n0 and
      ||Pi - T T^* - M L_P Pi|| <= id, and suppose C is an upper bound for a remainder constant pi b of
      Lemma 4.3. Then (P,T,(C,n0,id,ort,hor,mnorm,froot)) is a certified Root.
    hypotheses:
      - "(4.4) and (4.15)"
      - "C >= pi b for some b satisfying (4.10)"
    status: M
    status_parts: "M: the Taylor identity plus ||delta - T eta||^2 >= ||delta||^2 - (1+ort)||eta||^2, which needs no exact projectivity of TT^*"
    depends_on: [def-4.1, lem-4.3, lem-4.4]
    owner_team: T4 lean
    evidence: "§4.2 pp. 24-25 (proof p. 24); results/proof-claims.md §4"
    open_questions: "none"

  - id: prop-4.6
    kind: proposition
    title: "Certificates produced by the source"
    paper_locator: "§4.2, Proposition 4.6, p. 25; §A.5, p. 61"
    one_line_statement: >-
      Under the arithmetic conditions of Appendix A, every successful call to buildH::patch certifies
      (4.4), (4.15) and a valid remainder constant C, and therefore produces certified Root data in the
