  - id: lem-3.3
    kind: lemma
    title: "A closed covering of U(2)"
    paper_locator: "§3.3, Lemma 3.3, p. 15, eq. (3.12)"
    one_line_statement: >-
      Every V in U(2) has a representation V = e(alpha) * [[e(beta) cos(2 pi t), e(gamma) sin(2 pi t)],
      [-e(-gamma) sin(2 pi t), e(-beta) cos(2 pi t)]] with 0 <= alpha <= 1/2, 0 <= t <= 1/4,
      0 <= beta, gamma <= 1; and for every integer N_u divisible by 4 the products of closed intervals
      of width 1/N_u in these four coordinates cover that parameter domain, with bin counts
      N_u/2, N_u/4, N_u, N_u.
    hypotheses:
      - "N_u a positive integer divisible by 4 (the run uses N_u = 16, 32, 64, ... up to 512)"
    status: M
    status_parts: "M: row/column phase normalisation plus the determinant constraint; the four angle ranges are a fundamental domain"
    depends_on: []
    owner_team: T4 lean
    evidence: "§3.3 p. 14; results/proof-claims.md §3"
    open_questions: >-
      The lemma covers the parameter domain, not the canonical V of a given completion. Lemma 3.2 attaches
      a specific V and (3.11) bounds its distance to sqrt6 V; the paper then uses cell Taylor bounds for
      every representative. T9 should check the direction of that implication once (a point in the domain
      versus a point of U(2)).

