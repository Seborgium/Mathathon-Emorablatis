    one_line_statement: >-
      Let d_q = Pi(D_0(Q) - D_0(P) - N), eta_q = T^* d_q, h' = delta - d_q, xi = T^* h', nu = A h', and let
      D >= R + ||d_q||, v_0 >= n_P(R) + n_q, lambda >= alpha_P + gamma_P D, e_0 >= mu_P epsilon_Q,
      sigma >= ||S_h^* A||, beta = sqrt((1+o_P)(1+o_P)(1+o_Q)) be upper bounds, where S is the tangent
      matrix of the Q Root and S_h = Pi S. Then for every parent solution with t >= ||xi||:
      d <= D, d^2 <= (1+o_P) t^2 + ||nu||^2, ||nu|| <= min{v_0, (1+o_P)d, lambda d + e_0},
      ||S^* h'|| <= beta t + sigma ||nu|| and d^2 <= (1+o_Q)||S^*h'||^2 + n_Q(d)^2, where d = ||delta - d_q||.
    hypotheses:
      - "two certified Roots at P (radius R) and Q, and a parent solution delta with ||delta|| <= R"
