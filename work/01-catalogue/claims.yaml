# claims.yaml -- T1 catalogue of "The maximum number of mutually unbiased bases in
# dimension six" (OpenAI, 24 Sep 2026, 76 pp).
# FROZEN AT GATE G0. Other teams cite ids from this file; they do not edit it.
# Change requests: work/01-catalogue/changerequests/<team>.md
version: 1
paper: "The maximum number of mutually unbiased bases in dimension six (OpenAI, 24 Sep 2026)"
source_text: ".scratch/mub6.txt (4164 lines, layout-preserving extraction of the PDF)"
page_convention: >-
  "p. N is the PDF page on which the statement begins, as located by pdftotext -layout on
  .scratch/mub6.pdf (76 pages). Whether the printed footer of that page reads N or N-1 depends on
  counting the unnumbered title page; both readings occur in the literature of this file, so section
  and equation numbers are authoritative and page numbers are for navigation only. Page numbers inside
  evidence strings may be one low in the appendix."
status_key:
  M: "mathematical statement with a proof in the paper; statement checked and the main steps re-derived (results/proof-claims.md)"
  M?: "mathematical statement with a proof in the paper whose bookkeeping is long; sampled, not re-derived"
  S: "assertion about what a named routine does; the source is not in the packet, so this is a specification claim"
  C: "carries a hypothesis that a particular finite execution succeeded -- an event, not a mathematical condition"
  E: "observed datum: counts, hashes, timings"
  D: "definition or notation; no proof obligation. Listed because T2/T3/T4 must cite the exact statement."
conventions:
  status: >-
    Each entry has exactly one status: the weakest tag on which the claim AS STATED depends.
    The decomposition is in status_parts. So a coverage proposition whose argument is a proof but
    whose hypothesis is a completed run is tagged C, and its status_parts reads "M: ... ; S: ... ; C: ...".
  owner_team: >-
    The team that must discharge or dispose of the claim next, not the team that proved it.
    T1 catalogue owns nothing after G0 except this file; every entry below names a live owner.
  depends_on: "ids in this file; the graph is work/01-catalogue/dependencies.dot and is acyclic"
teams:
  - T1 catalogue
  - T2 checker
  - T3 reference
  - T4 lean
  - T5 parameters
  - T6 figures
  - T7 quantum
  - T8 paper
claims:

  # ------------------------------------------------------------------ 1
  - id: thm-1.1
    kind: theorem
    title: "Computer-assisted: no four MUBs in dimension six"
    paper_locator: "§1, Theorem 1.1, p. 3; restated as Theorem 7.1, §7.4, p. 52"
    one_line_statement: >-
      Under the arithmetic and compiler conditions of Appendix A, if the execution documented in
      §7.5 satisfies every terminal condition of §7.2, then there do not exist four pairwise
      mutually unbiased orthonormal bases of C^6; consequently N(6) = 3, where N(d) is the largest
      cardinality of a family of pairwise MUBs in C^d (with Lemma 1.2 for the lower bound).
    hypotheses:
      - "binary64 arithmetic, round-to-nearest, no contraction and no fast-math reassociation, correctly rounded sqrt, masked exceptions, no flush-to-zero (Appendix A, §7.1)"
      - "the seven sources of §7.1 compiled as recorded, and the bounded seven-stage control flow of §7.2"
      - "every terminal condition of §7.2 holds on that run (five numbered conditions, p. 51)"
    status: C
    status_parts: >-
      M: the implication from the coverage/exclusion propositions to the theorem (Lemma 1.2 and the
      chain of §7.4). S: the seven routines behave as §§2-6 describe. C: the run closed. E: Table 1.
    depends_on: [thm-7.1, lem-1.2]
    owner_team: T8 paper
    evidence: >-
      §1 p. 2 statement; the whole of §§2-7; restated as Theorem 7.1 p. 52 with its proof pp. 52-53.
      results/proof-claims.md §1 gives the six-link skeleton and tags every link.
    open_questions: >-
      The theorem's statement is honest (it names the execution) but its truth is not a function of
      the mathematics alone: 4 of the 6 links are S or C. T8 must decide whether the final paper
      states the theorem this way or replaces the S links by checkable inequalities (T2's format).

  - id: lem-1.2
    kind: lemma
    title: "Three mutually unbiased bases in dimension six"
    paper_locator: "§1.3, Lemma 1.2, p. 5"
    one_line_statement: >-
      There exist three pairwise mutually unbiased orthonormal bases of C^6: with
      w = e^(2*pi*i/3), A_0 = I_2, A_1 = (1/sqrt2)[[1,1],[1,-1]], A_2 = (1/sqrt2)[[1,1],[i,-i]],
      B_0 = I_3, B_1 = F = 3^(-1/2)(w^(jk)), B_2 = D F with D = diag(1,w,w), the three matrices
      U_r = A_r tensor B_r, r = 0,1,2, are unitary with pairwise unbiased column bases.
    hypotheses:
      - "no hypothesis beyond d = 6 = 2*3; the construction is the tensor product of d = 2 and d = 3 complete sets"
    status: M
    status_parts: "M: the proof is a finite computation; the only non-immediate step is the Gauss sum (F^* D F)_{jk} = (1/3) sum_x w^(x^2+(k-j)x) with squared modulus 1/3 for k != j"
    depends_on: []
    owner_team: T4 lean
    evidence: "§1.3 pp. 5-6; independently recomputed in results/proof-claims.md §2 (values 1+2w and 2+w^2, each of modulus^2 3)"
    open_questions: >-
      None mathematically. Note the paper prints D = diag(1,w,w), not diag(1,w,w^2); results/proof-claims.md
      records that the printed value is the corrected one. T4 should formalise exactly the printed D.

  - id: cor-1.3
    kind: corollary
    title: "Adjoint-closed Cartan subalgebras of sl_6(C)"
    paper_locator: "§1.4, Corollary 1.3, p. 6"
    one_line_statement: >-
      Under the arithmetic and compiler conditions of Appendix A and using the completed execution
      of §7.5 as in Theorem 1.1: for every family of pairwise Killing-orthogonal Cartan subalgebras
      of sl_6(C) that are all closed under one and the same standard adjoint X -> X^*, the family has
      at most three members, and three is attained.
    hypotheses:
      - "same hypotheses as Theorem 1.1 (it is invoked)"
      - "the reduction from MUBs to Cartan subalgebras of Boykin-Sitharam-Tiep-Wocjan [3, Thm 5.2]"
    status: C
    status_parts: "M: the key identity tr((bb^* - I/6)(cc^* - I/6)) = |<b,c>|^2 - 1/6 modulo the cited reduction. C: inherits Theorem 1.1"
    depends_on: [thm-1.1]
    owner_team: T7 quantum
    evidence: "§1.4 p. 6; proof cites [3, Theorem 5.2]; identity verified in results/proof-claims.md §1"
    open_questions: >-
      Adds nothing to the MUB statement but is the paper's only non-trivial corollary, so T7 must decide
      whether the final paper keeps it. If kept, the citation must be checked against [3] itself, which is
      not in the packet.

  # ------------------------------------------------------------------ 2
  - id: def-2.1
    kind: definition
    title: "Complex Hadamard matrix; extendible"
    paper_locator: "§2.1, Definition 2.1, p. 7"
    one_line_statement: >-
      H in C^{6x6} is called a complex Hadamard matrix here iff |H_ij| = 1 for all i,j and
      H H^* = 6 I; it is extendible iff the standard basis together with the columns of H/sqrt6 are
      contained in some family of four pairwise MUBs. (Remark, proved in the same paragraph: H H^* = 6I
      forces H^* H = 6I because H is square, and every such H equals e(P) = (exp(2*pi*i*P_ij)) for a
      real phase matrix P.)
    hypotheses:
      - "dimension fixed at 6 throughout"
    status: D
    status_parts: "D: the definition. The two appended facts (H^*H = 6I, existence of a real phase lift) are proved in one line each at p. 7"
    depends_on: []
    owner_team: T3 reference
    evidence: "§2.1 p. 7; the phase-lift and square-matrix facts are stated there without numbering"
    open_questions: >-
      The word extendible is defined relative to the coordinate basis. Lemma 2.2 asserts invariance of
      this notion under transposition, which is where the definition has to be read with care (see lem-2.2).

  - id: lem-2.2
    kind: lemma
    title: "Equivalences"
    paper_locator: "§2.1, Lemma 2.2, p. 7"
    one_line_statement: >-
      For every complex Hadamard H and every transformation Phi in the set {row permutation, column
      permutation, multiplication of rows by unit scalars, multiplication of columns by unit scalars,
      complex conjugation, transposition}: H is extendible iff Phi(H) is extendible.
    hypotheses:
      - "H is 6x6 complex Hadamard (Definition 2.1)"
      - "extendibility is read after normalising the first basis to the coordinate basis, as in §2.1"
    status: M
    status_parts: "M: all six cases are reversible; transposition is the only one that needs the swapping argument"
    depends_on: [def-2.1]
    owner_team: T4 lean
    evidence: "§2.1 pp. 7-8; results/proof-claims.md §2 records the transposition case (move to the pair (U^*,I))"
    open_questions: "none"

  - id: lem-2.3
    kind: lemma
    title: "Horizontal phase representatives"
    paper_locator: "§2.1, Lemma 2.3, p. 7, eq. (2.1)"
    one_line_statement: >-
      The map Pi(z) = z - (row means) - (column means) + (grand mean) is the orthogonal projection of
      R^{36} onto the horizontal subspace V = {z : all row sums and all column sums vanish}; hence
      ||Pi z||_F <= ||z||_F. If two phase matrices differ by z then they are row/column rephasing
      equivalent to matrices differing by Pi z, and the statement survives arbitrary entrywise integer
      changes of the phase representatives.
    hypotheses:
      - "phase matrices are identified with vectors in R^36 in row-major order"
    status: M
    status_parts: "M: projection is checked by the two symmetries of the centring operator; the invariance is immediate"
    depends_on: [def-2.1]
    owner_team: T4 lean
    evidence: "§2.1 p. 8, eq. (2.1); results/proof-claims.md §2 calls this the licence for all horizontal reasoning"
    open_questions: "none"

  - id: lem-2.4
    kind: lemma
    title: "Seed arrangement"
    paper_locator: "§2.2, Lemma 2.4, p. 8, eqs. (2.3)-(2.5)"
    one_line_statement: >-
      For every exact complex Hadamard matrix there is an equivalent dephased representative and a
      choice of a row pair attaining the minimum circular gap over all row and column pairs such that
      the first row phase list is x = (0,x_1..x_5) with 0 <= x_1 <= ... <= x_5 <= 1, gap g_x = 1 - x_5,
      and x_1 <= x_5 - x_4; and, after moving one of the five non-initial columns to position 2 and
      permuting the last four rows, the second column is y = (0,xi,y_2..y_5) with 0 <= y_2 <= ... <= y_5,
      xi the selected entry of x; moreover sum_j e(x_j) = 0, sum_j e(y_j) = 0 and g_y >= g_x.
    hypotheses:
      - "H exact (Definition 2.1), dephased so that its first row and column are 1"
      - "the minimum-gap pair is chosen once and used for both the x and the y list"
    status: M?
    status_parts: "M?: three-step construction (min-gap pair, transpose if needed, orientation swap x'_i = x_5 - x_{5-i}); the orientation step is where a reader must check, and it is four lines"
    depends_on: [lem-2.2, lem-2.3, def-2.1]
    owner_team: T4 lean
    evidence: "§2.2 pp. 8-9; proof pp. 9-10; results/proof-claims.md §2 (tagged M?)"
    open_questions: >-
      The statement quantifies over a choice (the selected column). Check that the selected position s
      used by seeds::mk (first minimiser of |2 b_s + 1 - N|, p. 8) is one of the five non-initial columns
      in the sense of the lemma; the paper says the selection "imposes no further condition on xi", so any
      choice must work. T2 must confirm the code records the same s it used.

  - id: lem-2.5
    kind: lemma
    title: "Stability of circular gaps"
    paper_locator: "§2.2, Lemma 2.5, p. 9"
    one_line_statement: >-
      For every pair of circular multisets in R/Z and every delta >= 0: if each point of the first is
      matched to a point of the second at circular distance at most delta, then every gap of the first
      differs from the corresponding gap of the second by at most 2*delta.
    hypotheses:
      - "matching is a bijection between the multisets"
    status: M
    status_parts: "M: trim delta from each end of an empty arc"
    depends_on: []
    owner_team: T4 lean
    evidence: "§2.2 p. 9; proof four lines"
    open_questions: "none"

  - id: lem-2.6
    kind: lemma
    title: "Necessary midpoint gap filters"
    paper_locator: "§2.2, Lemma 2.6, p. 9, eq. (2.8); filter (2.7) p. 7"
    one_line_statement: >-
      For every bin pair in the seed enumeration that contains lists x,y as in Lemma 2.4, with N = 112
      and l the bin index of x_5: the midpoint gaps satisfy g_{x,mid} <= 1 - (l-1)/N and
      g_{y,mid} >= 1 - (l+2)/N; and the index tuple satisfies a <= l - d + 1 and
      a/N <= x_1 <= x_5 - x_4 <= (l+1-d)/N.
    hypotheses:
      - "x,y arising from an exact Hadamard as in Lemma 2.4"
      - "bins of width w = 1/N, N = 112, closed, as in (2.6)"
    status: M
    status_parts: "M: Lemma 2.5 plus x_5 in [l/N,(l+1)/N]; the orientation restriction (2.7) is integral"
    depends_on: [lem-2.4, lem-2.5, eq-2.6, eq-2.7]
    owner_team: T4 lean
    evidence: "§2.2 p. 9; results/proof-claims.md §2"
    open_questions: "none"

  - id: lem-2.7
    kind: lemma
    title: "Necessary sum test"
    paper_locator: "§2.3, Lemma 2.7, p. 10, eqs. (2.10)-(2.11)"
    one_line_statement: >-
      Let w > 0, u in R^6, Delta in R^6 with |Delta_j| <= w/2 and 1 + sum_j e(u_j + Delta_j) = 0. Then
      with c = (1 + sum_j e(u_j))/(2*pi*i) and J_j the realification of e(u_j):
      ||c + J Delta|| <= 5*pi*w^2/4, and for every v in R^2,
      |v.c| <= (5*pi*w^2/4)||v|| + (w/2) sum_j |v.J_j|.
    hypotheses:
      - "the vanishing-sum hypothesis 1 + sum_j e(u_j + Delta_j) = 0"
      - "|Delta_j| <= w/2 for the six coordinates"
    status: M
    status_parts: "M: Taylor with |e''| = 4*pi^2; the division by 2*pi*i is what turns a vanishing sum into c + J Delta ~ 0"
    depends_on: [eq-2.6]
    owner_team: T4 lean
    evidence: "§2.3 pp. 9-10; results/proof-claims.md §2 notes the paper does not state the division by 2*pi*i explicitly"
    open_questions: >-
      The dimension of the varying list: the paper's Lemma 2.7 sums over the five varying entries while the
      seed normal form (2.3) has six entries with x_0 = 0 fixed. An audit (changerequests/T1-audit.md,
      CR-T1A-7) reads u, Delta in R^5 with J a 2x5 realification, which is what (2.13)-(2.14) and
      Lemma 2.9's J_* in R^{4x9} need. T4 must fix the index range from the PDF before formalising; the
      inequality itself is unaffected (the fixed coordinate contributes |v.J_0| = 0 if J_0 = 0).

  - id: lem-2.8
    kind: lemma
    title: "Shared-coordinate intervals"
    paper_locator: "§2.3, Lemma 2.8, p. 10, eqs. (2.12)-(2.14)"
    one_line_statement: >-
      Let t index a shared entry of the two lists (t = s for the x list, t = 0 for the y list) and put
      h = N(q - u) in [-1/2,1/2]^9, E = 5*pi/(4N). Every feasible displacement q satisfies, for every
      v in R^2, |N v.c + (v.J_t) h_t| <= E||v|| + (1/2) sum_{j != t} |v.J_j|; if a = v.J_t != 0 and r
      denotes the right side, then h_t lies in the closed interval [-Nv.c/a - r/|a|, -Nv.c/a + r/|a|].
      Necessity: the intervals computed from the x list and from the y list must intersect.
    hypotheses:
      - "the list pair is a feasible bin pair (Lemma 2.7 applies to both)"
      - "v.J_t != 0 for the direction actually used"
    status: M
    status_parts: "M: separate the shared term from (2.12), take the dot product with v, bound the rest"
    depends_on: [lem-2.7, eq-2.12, eq-2.14]
    owner_team: T4 lean
    evidence: "§2.3 pp. 9-10; results/proof-claims.md §2"
    open_questions: "none"

  - id: lem-2.9
    kind: lemma
    title: "Support bounds for center reuse"
    paper_locator: "§2.4, Lemma 2.9, p. 11, eqs. (2.17)-(2.19)"
    one_line_statement: >-
      Let u' be a previously retained midpoint with the same selected position s, k = N(u - u') in Z^9,
      h = N(q - u) in [-1/2,1/2]^9. Every feasible displacement q of the current bin pair satisfies
      N^2 ||q - u'||^2 = ||k + h||^2 <= ||k||^2 + 9/4 + 2 k.h; and for every v in R^4 the last term is
      bounded by 2k.h <= sum_j |k_j| (2.18) and by
      2k.h <= sum_j |k_j - (J^*_T v)_j| + 2 v.p_* + 2E(||v_X|| + ||v_Y||) (2.19), where v_X, v_Y are the
      two real two-vector blocks of v.
    hypotheses:
      - "u' was retained with the same selected position s"
      - "q is a feasible displacement of the current bin pair, so h = N(q-u) in [-1/2,1/2]^9"
    status: M
    status_parts: "M: expand ||k+h||^2 and bound 2k.h in two ways"
    depends_on: [eq-2.12]
    owner_team: T4 lean
    evidence: "§2.4 p. 11; results/proof-claims.md §2"
    open_questions: >-
      (2.19) is the one place where the paper lets a stored dual proposal v be anything with entries in
      modulus <= 1e4; the inequality is valid for every v, so the proposal method is irrelevant (T2 must
      keep it that way: evaluate the inequality, do not trust the proposal).

  - id: prop-2.10
    kind: proposition
    title: "Exhaustive seed cover"
    paper_locator: "§2.4, Proposition 2.10, p. 12; arithmetic in §A.3, p. 58"
    one_line_statement: >-
      For every completed execution of the specified covout traversal under the arithmetic of
      Appendix A: for every exact complex Hadamard matrix H there is an equivalent (Definition 2.1,
      Lemma 2.2) Hadamard matrix whose nine seed coordinates (s; q as in (2.15)) lie in one of the
      written rational midpoint balls, with the recorded selected position, at distance at most 0.032;
      and after conversion of the centres to binary phases the radius 0.0320001 suffices.
    hypotheses:
      - "the traversal covout completed normally"
      - "the enumeration visits every admissible bin tuple (2.6)-(2.7) and every matching y-tuple"
      - "the arithmetic conditions of Appendix A hold"
    status: C
    status_parts: >-
      M: induction over the traversal; a fresh centre is within sqrt9/(2N) = 3/224 < 0.032 and each
      retained centre is certified by Lemma 2.9. S: seeds::build enumerates every tuple. C: covout closed.
    depends_on: [lem-2.2, lem-2.4, lem-2.6, lem-2.7, lem-2.8, lem-2.9, eq-2.6, eq-2.7, eq-2.12, eq-2.14]
    owner_team: T4 lean
    evidence: "§2.4 pp. 11-12 (proof pp. 11-12); §A.3 pp. 58-59; Table 1 row 'Seed cover' p. 53"
    open_questions: >-
      The enumeration completeness (S) is the only unproved part; results/code-audit.md rates it UNCHK
      but lists centres.txt as sufficient evidence. Disposition proposed in reports/T1-report.md.

  - id: eq-2.6
    kind: equation
    title: "Closed bins"
    paper_locator: "§2.2, eq. (2.6), p. 8"
    one_line_statement: >-
      With N = 112 and w = 1/N: for every b with 0 <= b < N the interval I_b = [b/N,(b+1)/N] is closed
      and has midpoint u_b = (b+1/2)/N; the family {I_b} covers [0,1] including both endpoints, so every
      phase has a bin index and boundary points may get two.
    hypotheses:
      - "N = 112 chosen in the run; the statement holds for every N >= 1"
    status: M
    status_parts: "M: trivial; load-bearing because closure and endpoint sharing is what makes the cover sound (an open bin would lose the torus boundary)"
    depends_on: []
    owner_team: T3 reference
    evidence: "§2.2 p. 7"
    open_questions: "none"

  - id: eq-2.7
    kind: equation
    title: "Necessary integral restriction on the seed index tuple"
    paper_locator: "§2.2, eq. (2.7), p. 9"
    one_line_statement: >-
      For every feasible seed with nondecreasing bin indices b_X = (a,b,c,d,l) of x_1..x_5:
      a <= l - d + 1 and a/N <= x_1 <= x_5 - x_4 <= (l+1-d)/N.
    hypotheses:
      - "indices are nondecreasing, so the exact phases lie in their bins"
      - "the orientation condition x_1 <= x_5 - x_4 of Lemma 2.4"
    status: M
    status_parts: "M: one-line interval arithmetic"
    depends_on: [lem-2.4, eq-2.6]
    owner_team: T4 lean
    evidence: "§2.2 p. 7"
    open_questions: "none"

  - id: eq-2.12
    kind: equation
    title: "Grid-unit form of the sum test"
    paper_locator: "§2.3, eq. (2.12), p. 10"
    one_line_statement: >-
      For every h = N*Delta with |h_j| <= 1/2: with E = 5*pi/(4N), ||J h + N c|| <= E, where c and J are
      as in Lemma 2.7.
    hypotheses:
      - "the vanishing-sum hypothesis of Lemma 2.7"
      - "|h_j| <= 1/2"
    status: M
    status_parts: "M: Lemma 2.7 multiplied by N"
    depends_on: [lem-2.7]
    owner_team: T4 lean
    evidence: "§2.3 p. 9"
    open_questions: "none"

  - id: eq-2.14
    kind: equation
    title: "Closed interval constraint for the shared coordinate"
    paper_locator: "§2.3, eq. (2.14), p. 10"
    one_line_statement: >-
      Let a = v.J_t != 0 and let r be the right side of (2.13). Then h_t lies in the closed interval
      [-Nv.c/a - r/|a|, -Nv.c/a + r/|a|]; and for a feasible pair the intervals obtained from the x list
      and from the y list intersect.
    hypotheses:
      - "a != 0"
      - "Lemma 2.8 applies to both lists"
    status: M
    status_parts: "M: solve the scalar inequality of Lemma 2.8"
    depends_on: [eq-2.12]
    owner_team: T4 lean
    evidence: "§2.3 p. 9"
    open_questions: "none"

  # ------------------------------------------------------------------ 3
  - id: lem-3.1
    kind: lemma
    title: "Fixed frames"
    paper_locator: "§3.1, Lemma 3.1, p. 13, eqs. (3.4)-(3.5)"
    one_line_statement: >-
      Let p in C^4 have unit-modulus entries, S = sum_j p_j, M = (1 p) the 4x2 matrix. Then the squared
      singular values of M are 4 +/- |S|; if |S| < 4 then
      M (M^* M)^{-1} = (16 - |S|^2)^{-1} (4*1 - p conj(S), 4p - 1 S) and there exists an orthonormal 4x2
      matrix K with range K = ker M^* (constructible by Gram-Schmidt from 1/2, the normalised residual of
      p and projected coordinate vectors with nonzero residuals).
    hypotheses:
      - "|p_j| = 1 for j = 1..4, i.e. the seed's upper rows are unit-modulus"
      - "|S| < 4"
    status: M
    status_parts: "M: direct computation of M^*M and of the pseudo-inverse; the Gram-Schmidt claim is contingent on the residual being nonzero, which is where the frame check m > 1.25 enters"
    depends_on: [def-2.1]
    owner_team: T4 lean
    evidence: "§3.1 pp. 12-13; §A.4 pp. 59-60 for the numerical frame check (m_B, m_C > 1.24 ideal, 16 - |S|^2 > 6.1)"
    open_questions: >-
      The lemma is about p with |S| < 4; the run needs the quantitative m_B, m_C > 0 and uses 1/m_B, 1/m_C
      in every later bound. Those lower bounds are empirical frame-check outputs, not part of Lemma 3.1.

  - id: lem-3.2
    kind: lemma
    title: "Polar comparison"
    paper_locator: "§3.2, Lemma 3.2, p. 14, eqs. (3.8)-(3.11)"
    one_line_statement: >-
      For every feasible completion of the seed (H' as in §3.1), with Y = K_C^* D' K_B:
      6I - Y^*Y = K_B^* B'^*B' K_B + K_B^* D'^* P_C D' K_B >= 0 and
      tr(6I - Y^*Y) <= q := R_s^2 (1 + (A_*^2 + 6)/m_C^2); if q < 6 then the polar factor
      V = Y (Y^*Y)^{-1/2} lies in U(2) and ||Y - sqrt6 V||_F <= p := sqrt(q/(6 + sqrt6 - q)) ... (3.11).
    hypotheses:
